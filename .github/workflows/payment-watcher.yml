name: Payment Watcher
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch: {}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Gumroad sales + notify
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$GUMROAD_TOKEN" ]; then echo "GUMROAD_TOKEN not set yet — owner pending"; exit 0; fi
          COUNT=$(curl -s "https://api.gumroad.com/v2/sales?access_token=$GUMROAD_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sales_count','ERR'))")
          LAST=$(cat state/last_sales_count 2>/dev/null || echo 0)
          echo "sales_count=$COUNT last=$LAST"
          if [ "$COUNT" != "ERR" ] && [ "$COUNT" -gt "$LAST" ] 2>/dev/null; then
            NEW=$((COUNT-LAST))
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" -d text="💸 $NEW NEW SALE(S) on Gumroad! Total: $COUNT — details on next briefing."
          fi
          mkdir -p state; [ "$COUNT" != "ERR" ] && echo "$COUNT" > state/last_sales_count
      - name: Commit state
        run: |
          git config user.name "sovereign-bot"; git config user.email "bot@sovereign.ops"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: sales count $(date -u +%FT%TZ)"
            git push
          fi
