name: Revenue Briefing
on:
  schedule: [{cron: "0 6,18 * * *"}]
  workflow_dispatch: {}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revenue vs $1000/day goal
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          SALES="0"
          if [ -n "$GUMROAD_TOKEN" ]; then
            SALES=$(curl -s "https://api.gumroad.com/v2/sales?access_token=$GUMROAD_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sales_count',0))" 2>/dev/null || echo 0)
          fi
          MSG="📊 SOVEREIGN BRIEFING $(date -u +%F)
          — Goal: \$1000/day
          — Gumroad sales (lifetime): $SALES
          — VM: $(grep -c UNREACHABLE state/vm_health.log 2>/dev/null || echo 0) outages logged
          — A1: retry active every 30min
          Full ledger: money_engine/LEDGER.md"
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="$MSG"
